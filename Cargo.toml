[package]
name = "ord"
description = "◉ Rare-sat tracker: per-block locations of the rare sats that matter, without a full sat index"
version = "0.29.0-sats.1"
autotests = false
autobins = false

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[workspace]
members = [".", "crates/*"]

[workspace.package]
authors = ["The Ord Maintainers", "Robert Clarke"]
edition = "2024"
homepage = "https://github.com/RobertClarke/ord-1"
license = "CC0-1.0"
repository = "https://github.com/RobertClarke/ord-1"
rust-version = "1.89.0"

[workspace.dependencies]
base64 = "0.22.0"
bitcoin = { version = "0.32.5", features = ["rand", "serde"] }
derive_more = { version = "1.0.0", features = ["display", "from_str"] }
hex = "0.4.3"
pretty_assertions = "1.2.1"
reqwest = { version = "0.12.0", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0.137", features = ["derive"] }
serde_json = { version = "1.0.81", features = ["preserve_order"] }
serde_with = "3.7.0"
tempfile = "3.2.0"

[dependencies]
anyhow = { version = "1.0.90", features = ["backtrace"] }
axum = { version = "0.8.1", features = ["http2"] }
base64.workspace = true
bitcoin.workspace = true
clap = { version = "4.4.2", features = ["derive", "env"] }
crossbeam-channel = "0.5.13"
dirs = "6.0.0"
env_logger = "0.11.0"
hex.workspace = true
log = "0.4.14"
ordinals = { version = "0.0.17", path = "crates/ordinals" }
rayon = "1.10.0"
redb = "3.1.0"
reqwest.workspace = true
rustc-hash = "2.1.0"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "cors"] }

[dev-dependencies]
mockcore = { path = "crates/mockcore" }
pretty_assertions.workspace = true
tempfile.workspace = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
lto = "thin"

[[bin]]
name = "ord"
path = "src/bin/main.rs"
test = false

[lib]
name = "ord"
path = "src/lib.rs"
doctest = false

[[test]]
name = "integration"
path = "tests/lib.rs"
